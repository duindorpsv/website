# Isolated local/CI verification stack. Production uses the selected cloud project.
project_id = "duindorp-sv-verification"
[api]
enabled = true
port = 62621
schemas = ["public"]
extra_search_path = ["public", "extensions"]
auto_expose_new_tables = false
[db]
port = 62622
shadow_port = 62620
major_version = 17
[db.migrations]
enabled = false
[db.seed]
enabled = false
[db.pooler]
enabled = false
[studio]
enabled = false
[realtime]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = true
file_size_limit = "512MiB"
[storage.s3_protocol]
enabled = true
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/beheer/herstel"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
jwt_expiry = 3600
[auth.email]
# Enable the password provider; global enable_signup=false still blocks signup.
enable_signup = true
enable_confirmations = true
[auth.mfa]
max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[auth.rate_limit]
sign_in_sign_ups = 1000
token_refresh = 1000
token_verifications = 1000
[analytics]
enabled = false
[edge_runtime]
enabled = false
