name: Build and deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duindorp-production
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: source
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ghcr.io/duindorpsv/website:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            nl.duindorpsv.source-tree=${{ steps.source.outputs.tree }}
          provenance: mode=max
      - env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: python3 ops/scripts/release.py create release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release
          path: release.json
          retention-days: 90
          overwrite: true
  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, duindorpsv-production]
    environment: production
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release
      - name: Deploy verified production artifact
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CFG_APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          CFG_S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          CFG_S3_REGION: ${{ vars.S3_REGION }}
          CFG_S3_BUCKET: ${{ vars.S3_BUCKET }}
          CFG_MAIL_FROM: ${{ vars.MAIL_FROM }}
          CFG_NEWS_IMPORT_MAX_MB: ${{ vars.NEWS_IMPORT_MAX_MB }}
          CFG_NEWS_IMPORT_MAX_UNPACKED_MB: ${{ vars.NEWS_IMPORT_MAX_UNPACKED_MB }}
          CFG_NEWS_IMPORT_MAX_ENTRIES: ${{ vars.NEWS_IMPORT_MAX_ENTRIES }}
          CFG_TRUST_PROXY_IP: ${{ vars.TRUST_PROXY_IP }}
          CFG_RESTIC_REPOSITORY: ${{ vars.RESTIC_REPOSITORY }}
          CFG_BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          CFG_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          CFG_APP_DATABASE_PASSWORD: ${{ secrets.APP_DATABASE_PASSWORD }}
          CFG_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CFG_AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          CFG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          CFG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          CFG_RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          CFG_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          CFG_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          CFG_SPORTLINK_CLIENT_ID: ${{ secrets.SPORTLINK_CLIENT_ID }}
        run: |
          python3 - <<'PY' | sudo -n -u duindorpsv-production /usr/local/libexec/duindorp/duindorp-deploy-production
          import json,os
          configuration={key[4:]:value for key,value in os.environ.items() if key.startswith('CFG_')}
          print(json.dumps({'release':json.load(open('release.json')),'token':os.environ['DEPLOY_TOKEN'],'configuration':configuration}))
          PY
