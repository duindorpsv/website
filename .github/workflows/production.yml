name: Promote tested staging release
on:
  push:
    branches: [production]
permissions:
  contents: read
concurrency:
  group: duindorp-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ops/scripts/release.py promote release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-release
          path: release.json
          retention-days: 90
  deploy:
    needs: verify
    runs-on: [self-hosted, linux, x64, duindorpsv-production]
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-release
      - env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' | sudo -n -u duindorpsv-production /usr/local/libexec/duindorp/duindorp-deploy-production
          import json,os
          print(json.dumps({'release':json.load(open('release.json')),'token':os.environ['DEPLOY_TOKEN']}))
          PY
