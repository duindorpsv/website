name: Development checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging, production]
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      database:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: duindorp
          POSTGRES_DB: duindorp_test
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U duindorp -d duindorp_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      APP_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgres://duindorp:${{ github.run_id }}@127.0.0.1:5432/duindorp_test
      MEDIA_DRIVER: filesystem
      MEDIA_ROOT: ${{ github.workspace }}/.runtime/media
      TEST_MAIL_TO: test@example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate serving-host checks and deployment identities
        run: python3 -m unittest discover -s ops/tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          mkdir -p .runtime
          session_secret=$(openssl rand -hex 32)
          echo "::add-mask::$session_secret"
          printf 'AUTH_SESSION_SECRET=%s\n' "$session_secret" >> "$GITHUB_ENV"
      - run: pnpm test && pnpm typecheck
      - run: pnpm db:migrate && pnpm db:seed && pnpm test:integration
      - run: pnpm build && pnpm build:runtime
      - run: |
          pnpm exec tsx scripts/development-test-account.ts
          docker build -t duindorp-ci .
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {randomBytes} from 'node:crypto';
          const values={};
          for(const key of ['APP_ENV','APP_BASE_URL','DATABASE_URL','AUTH_SESSION_SECRET','MEDIA_DRIVER','TEST_MAIL_TO']) values[key]=process.env[key];
          const password=randomBytes(24).toString('hex');console.log('::add-mask::'+password);
          writeFileSync('.runtime/provision.env','MIGRATION_DATABASE_URL='+process.env.DATABASE_URL+'\nAPP_DATABASE_PASSWORD='+password+'\n',{mode:0o600});
          const url=new URL(values.DATABASE_URL);url.username='duindorp_app';url.password=password;values.DATABASE_URL=url.href;
          values.MEDIA_ROOT='/data/media';values.RELEASE_DIGEST='ci-image';
          writeFileSync('.runtime/image.env',Object.entries(values).map(([key,value])=>key+'='+value).join('\n')+'\n',{mode:0o600});
          JS
          set -a
          source .runtime/provision.env
          set +a
          pnpm exec tsx scripts/provision-database.ts
          sudo chown -R 1000:1000 .runtime/media
          pnpm exec tsx -e 'import {sqlClient,closeDb} from "./db/index.ts";void(async()=>{await sqlClient()`delete from cms_heartbeats`;await closeDb();})();'
          docker run -d --name duindorp-ci-worker --memory=512m --network host --env-file .runtime/image.env --mount type=bind,src="$PWD/.runtime/media",dst=/data/media --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges duindorp-ci worker
          docker run -d --name duindorp-ci-web --memory=768m --network host --env-file .runtime/image.env --mount type=bind,src="$PWD/.runtime/media",dst=/data/media --read-only --tmpfs /tmp --tmpfs /app/.next/cache:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges duindorp-ci
          pnpm exec playwright install --with-deps chromium --only-shell
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null
          test "$(docker inspect -f '{{.State.Running}}' duindorp-ci-worker)" = true
          pnpm test:e2e
          docker restart duindorp-ci-web
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null
      - if: always()
        run: |
          docker logs duindorp-ci-web > .runtime/web.log 2>&1 || true
          docker logs duindorp-ci-worker > .runtime/worker.log 2>&1 || true
          docker rm -f duindorp-ci-web duindorp-ci-worker >/dev/null 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification
          path: |
            .runtime/e2e-report.json
            .runtime/news-large-proof.json
            .runtime/screenshots
          retention-days: 14
