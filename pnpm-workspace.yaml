minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
enableGlobalVirtualStore: false
packageImportMethod: auto

packages:
  - runtime
resolvePeersFromWorkspaceRoot: false
catalog:
  "@aws-sdk/client-s3": "3.1146.0"
  "drizzle-orm": "0.45.2"
  "postgres": "3.4.9"
  "sharp": "0.35.4"
  "zod": "^3.25.76"
