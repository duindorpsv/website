services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: duindorp
      POSTGRES_DB: duindorp
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Set development password}
    ports: ['127.0.0.1:62522:5432']
    volumes: ['database:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duindorp -d duindorp']
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  database:
