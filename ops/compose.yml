services:
  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: duindorp_migration
      POSTGRES_DB: duindorp
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes: ['database:/var/lib/postgresql/data']
    mem_limit: 512m
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duindorp_migration -d duindorp']
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: ${APP_IMAGE:?Use an immutable approved digest}
    restart: unless-stopped
    env_file: ['${RUNTIME_ENV_FILE:?Fixed protected runtime file}']
    environment: {RELEASE_DIGEST: '${RELEASE_DIGEST:?Set release digest}'}
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777', '/app/.next/cache:size=64m,uid=1000,gid=1000']
    ports: ['127.0.0.1:${WEB_PORT:?Choose an inventoried free port}:3000']
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on: {database: {condition: service_healthy}}
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    image: ${APP_IMAGE:?Use an immutable approved digest}
    command: [worker]
    restart: unless-stopped
    env_file: ['${RUNTIME_ENV_FILE:?Fixed protected runtime file}']
    environment: {RELEASE_DIGEST: '${RELEASE_DIGEST:?Set release digest}'}
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on: {database: {condition: service_healthy}}
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  migration:
    image: ${APP_IMAGE:?Use an immutable approved digest}
    command: [migrate]
    profiles: [migration]
    env_file: ['${MIGRATION_ENV_FILE:?Separate protected migration environment}']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on: {database: {condition: service_healthy}}
  provision:
    image: ${APP_IMAGE:?Use an immutable approved digest}
    command: [provision]
    profiles: [bootstrap]
    env_file: ['${PROVISION_ENV_FILE:?Separate private provisioning configuration}']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on: {database: {condition: service_healthy}}
secrets:
  database_password:
    file: ${DATABASE_PASSWORD_FILE:?Protected password file}
volumes:
  database:
